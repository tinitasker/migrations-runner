name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate shell sources
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Validate Dockerfile
        run: docker build --check .

  sast-scan:
    name: SAST scan
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Scan filesystem vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          format: table
          exit-code: '1'
          timeout: 15m

  build:
    name: Build
    needs: sast-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build runner image
        run: docker build --tag tinitasker/migrations-runner:verify .

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run portable test suite
        run: make test

      - name: Run PostgreSQL 18 integration suite
        run: make integration-test
