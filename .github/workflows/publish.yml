name: Publish migrations runner

run-name: Publish migrations runner v${{ inputs.version }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version in X.Y.Z format, without a leading v.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-migrations-runner
  cancel-in-progress: false

jobs:
  validate:
    name: Validate publication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.version.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and revision
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          version="$REQUESTED_VERSION"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid version::Expected X.Y.Z without a leading v, prerelease labels, or leading zeroes; received '$version'."
            exit 1
          fi

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo '::error title=Invalid revision::The selected revision must belong to main.'
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Reject existing immutable package tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          case "$OWNER_TYPE" in
            Organization) package_scope=orgs ;;
            User) package_scope=users ;;
            *)
              echo "::error title=Version check failed::Unsupported repository owner type '$OWNER_TYPE'."
              exit 1
              ;;
          esac

          owner="$GITHUB_REPOSITORY_OWNER"
          package="${GITHUB_REPOSITORY#*/}"
          error_file="$RUNNER_TEMP/ghcr-version-check-error"

          set +e
          published_tags="$(
            gh api --paginate "/$package_scope/$owner/packages/container/$package/versions" \
              --jq '.[].metadata.container.tags[]' 2>"$error_file"
          )"
          status=$?
          set -e

          if [[ $status -ne 0 ]]; then
            if grep -q 'HTTP 404' "$error_file"; then
              echo 'No existing migrations-runner package was found.'
              exit 0
            fi
            echo '::error title=Version check failed::Unable to read existing GHCR package versions.'
            sed -n '1,20p' "$error_file"
            exit 1
          fi

          for immutable_tag in "v$VERSION" "$VERSION" "sha-$GITHUB_SHA"; do
            if grep -Fxq "$immutable_tag" <<< "$published_tags"; then
              echo "::error title=Existing image version::The immutable package tag '$immutable_tag' already exists."
              exit 1
            fi
          done

          latest_version="$({
            sed -En 's/^v?((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$/\1/p' <<< "$published_tags" |
              sort -Vu |
              tail -n 1
          } || true)"
          if [[ -n "$latest_version" ]] && dpkg --compare-versions "$VERSION" le "$latest_version"; then
            echo "::error title=Version is not newer::Version $VERSION must be greater than the latest published stable version, $latest_version."
            exit 1
          fi

  sast-scan:
    name: SAST scan
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Scan filesystem vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          format: table
          exit-code: '1'
          timeout: 15m

  test:
    name: Test
    needs: sast-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate shell sources
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Run portable test suite
        run: make test

      - name: Run PostgreSQL 18 integration suite
        run: make integration-test

  publish:
    name: Build and publish runner image
    needs:
      - validate
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish immutable runner image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.validate.outputs.image }}:v${{ needs.validate.outputs.version }}
            ${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.version }}
            ${{ needs.validate.outputs.image }}:sha-${{ github.sha }}
            ${{ needs.validate.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Record immutable image reference
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error title=Invalid image digest::The published image did not produce a sha256 digest.'
            exit 1
          fi
          # The backticks are intentional Markdown delimiters.
          # shellcheck disable=SC2016
          printf 'Use `%s@%s` in service workflow configuration.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
